<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mostaql Scraper{% endblock %}</title>
    <!-- MUI CSS (muicss.com) - lightweight, no build step, fast iteration -->
    <link rel="stylesheet" href="https://cdn.muicss.com/mui-0.10.3/css/mui.min.css">
    <script src="https://cdn.muicss.com/mui-0.10.3/js/mui.min.js"></script>
    <style>
        body { padding: 24px; background: #f5f6f8; }
        .mui-appbar { padding: 12px 16px; margin-bottom: 24px; }
        .mui-panel { margin-bottom: 20px; }
        #drop-zone {
            border: 2px dashed #9e9e9e;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #757575;
            cursor: pointer;
            background: #fafafa;
            transition: background .25s ease, border-color .25s ease, box-shadow .25s ease, transform .15s ease, color .25s ease;
        }
        #drop-zone:hover {
            background: #eef6ff;
            border-color: #2196f3;
            color: #1976d2;
            box-shadow: 0 4px 14px rgba(33,150,243,.18);
            transform: translateY(-2px);
        }
        #drop-zone:active { transform: translateY(0); }
        #drop-zone.dragover {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #1976d2;
            box-shadow: 0 6px 18px rgba(33,150,243,.28);
            transform: translateY(-2px) scale(1.01);
        }
        .warning-banner {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 6px;
            background: #fff8e1;
            border: 1px solid #ffb300;
            color: #8a6d00;
            font-size: 13px;
        }
        .warning-banner.show { display: block; }
        pre#log-box {
            background: #111; color: #0f0; padding: 12px; height: 260px;
            overflow-y: auto; font-size: 12px; border-radius: 4px;
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .progress-outer {
            background: #e9ecef;
            border-radius: 999px;
            overflow: hidden;
            height: 14px;
            flex: 1 1 auto;
            box-shadow: inset 0 1px 3px rgba(0,0,0,.15);
            position: relative;
        }
        .progress-inner {
            background: linear-gradient(90deg, #42a5f5, #1976d2);
            background-size: 40px 40px;
            height: 100%;
            transition: width .4s cubic-bezier(.4,0,.2,1);
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }
        .progress-inner::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(
                45deg,
                rgba(255,255,255,.18) 25%, transparent 25%,
                transparent 50%, rgba(255,255,255,.18) 50%,
                rgba(255,255,255,.18) 75%, transparent 75%, transparent
            );
            background-size: 28px 28px;
            animation: progress-stripes 1s linear infinite;
        }
        .progress-inner.running::after { animation-play-state: running; }
        .progress-inner.idle-bar { background: linear-gradient(90deg, #b0bec5, #90a4ae); }
        @keyframes progress-stripes {
            from { background-position: 0 0; }
            to { background-position: 28px 0; }
        }
        .progress-label {
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            white-space: nowrap;
            min-width: 44px;
            text-align: right;
        }
        .progress-desc {
            font-size: 12px;
            color: #757575;
            margin-bottom: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 6px;
        }
        .progress-time-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            font-size: 12px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-weight: 600;
            color: #1976d2;
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 14px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .progress-time-badge.running {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.15);
        }
        .progress-time-badge.idle {
            background: #f5f5f5;
            color: #757575;
            border-color: #e0e0e0;
        }
        .progress-time-badge .time-icon {
            font-size: 13px;
        }
        .progress-sub-row { margin-bottom: 6px; }
        .progress-sub-row .progress-outer { height: 10px; }
        .progress-sub-row .progress-desc { font-size: 11px; }
        .progress-sub-row .progress-label { font-size: 11px; min-width: 36px; }
        .command-card { display:block; text-decoration:none; color:inherit; }
        .command-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        .badge { display:inline-block; padding:2px 8px; border-radius: 10px; font-size: 11px; color:#fff; }
        .badge-idle { background:#9e9e9e; }
        .badge-running { background:#ff9800; }
        .badge-error { background:#f44336; }

        /* Report section tabs */
        .report-tabs { display:flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 12px; }
        .report-tab-btn {
            border: none; background: none; cursor: pointer;
            padding: 8px 18px; font-size: 13px; font-weight: 600; color: #757575;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: color .2s ease, border-color .2s ease;
        }
        .report-tab-btn:hover { color: #1976d2; }
        .report-tab-btn.active { color: #1976d2; border-color: #1976d2; }
        .report-tab-panel { display: none; }
        .report-tab-panel.active { display: block; }
        .report-grid-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .report-grid-table th, .report-grid-table td {
            border: 1px solid #e0e0e0; padding: 8px 10px; text-align: left; vertical-align: top;
            word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
        }
        .report-grid-table th { background: #f5f6f8; width: 220px; font-weight: 600; color: #444; }
        .report-grid-table tr:nth-child(even) td { background: #fafafa; }
        .report-val-number { color: #1565c0; font-family: monospace; }
        .report-val-bool-true { color: #2e7d32; font-weight: 600; }
        .report-val-bool-false { color: #c62828; font-weight: 600; }
        .report-val-null { color: #9e9e9e; font-style: italic; }
        .report-val-status-running {
            display: inline-block;
            padding: 2px 8px;
            background: #e3f2fd;
            color: #1565c0;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .report-val-status-completed {
            display: inline-block;
            padding: 2px 8px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .report-val-object { font-family: monospace; font-size: 12px; }
        .report-val-empty { color: #9e9e9e; font-style: italic; }
        .report-grid-table--nested { margin: 0; box-shadow: none; }
        .report-grid-table--nested th { width: auto; background: #eef1f5; }
        td > .report-grid-table--nested { border: none; }
        .report-empty { color: #9e9e9e; font-style: italic; padding: 8px 0; }
        .raw-json-wrapper { position: relative; }
        .copy-btn {
            position: absolute; top: 8px; right: 8px;
            background: #263238; color: #fff; border: none; border-radius: 4px;
            padding: 5px 12px; font-size: 12px; cursor: pointer;
            transition: background .2s ease, transform .15s ease;
        }
        .copy-btn:hover { background: #37474f; }
        .copy-btn.copied { background: #2e7d32; transform: scale(1.05); }
        pre#report-raw {
            background: #111; color: #e0e0e0; padding: 14px 12px; padding-top: 40px;
            border-radius: 6px; font-size: 12px; max-height: 420px; overflow: auto; margin: 0;
        }

        /* Stop button */
        .mui-btn--danger { background: #f44336 !important; color: #fff !important; }
        .mui-btn--danger:hover { background: #d32f2f !important; }
        .mui-btn--danger:disabled { background: #e0a8a4 !important; cursor: not-allowed; }

        /* Workers accordion */
        #workers-accordion { display: flex; flex-direction: column; gap: 8px; }
        .worker-item {
            border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;
            background: #fff; transition: box-shadow .2s ease;
        }
        .worker-item.cooldown { border-color: #ff9800; }
        .worker-item.error { border-color: #f44336; }
        .worker-header {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; cursor: pointer; user-select: none;
            background: #fafafa;
        }
        .worker-header:hover { background: #f0f4f8; }
        .worker-header .worker-title { font-weight: 600; font-size: 13px; flex: 1; }
        .worker-header .worker-caret { transition: transform .2s ease; color: #757575; }
        .worker-item.open .worker-header .worker-caret { transform: rotate(90deg); }
        .worker-body {
            max-height: 0; overflow: hidden; transition: max-height .25s ease;
            padding: 0 14px; font-size: 12px; color: #555;
        }
        .worker-item.open .worker-body { max-height: 200px; padding: 10px 14px; }
        .worker-donut-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
        .worker-donut-wrap svg { transform: rotate(-90deg); }
        .worker-donut-bg { fill: none; stroke: #e9ecef; stroke-width: 4; }
        .worker-donut-fg {
            fill: none; stroke: #ff9800; stroke-width: 4; stroke-linecap: round;
            transition: stroke-dashoffset .4s linear, stroke .3s ease;
        }
        .worker-donut-fg.ok { stroke: #4caf50; }
        .worker-donut-label {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 700; color: #444;
        }
        .worker-empty { color: #9e9e9e; font-style: italic; padding: 8px 0; }

        /* History Directory Tree & File Download Components */
        .history-tree-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 10px;
        }
        .tree-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .tree-toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1 1 250px;
        }
        .tree-search-input {
            width: 100%;
            max-width: 340px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .tree-search-input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        .tree-toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tree-btn {
            background: #f5f6f8;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 500;
            color: #444;
            cursor: pointer;
            transition: all .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tree-btn:hover {
            background: #eef2f7;
            border-color: #1976d2;
            color: #1976d2;
        }
        .history-tree-root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: #333;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .tree-node {
            margin: 2px 0;
            user-select: none;
        }
        .tree-folder-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color .15s ease, color .15s ease;
        }
        .tree-folder-header:hover {
            background-color: #f0f4f9;
        }
        .tree-caret {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            font-size: 10px;
            color: #666;
            transition: transform .2s ease;
            flex-shrink: 0;
        }
        .tree-node--folder.open > .tree-folder-header > .tree-caret {
            transform: rotate(90deg);
        }
        .tree-folder-icon-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .tree-folder-icon {
            font-size: 16px;
            line-height: 1;
        }
        .folder-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1px 6px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 10px;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
            line-height: 1.3;
            letter-spacing: 0.2px;
        }
        .tree-folder-title {
            font-weight: 600;
            color: #2c3e50;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tree-meta {
            font-size: 11px;
            color: #888;
            margin-left: auto;
            flex-shrink: 0;
            font-weight: normal;
        }
        .tree-folder-children {
            display: none;
            margin-left: 14px;
            padding-left: 8px;
            border-left: 1.5px dashed #cfd8dc;
        }
        .tree-node--folder.open > .tree-folder-children {
            display: block;
        }
        .tree-file-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color .15s ease, transform .1s ease;
        }
        .tree-file-row:hover {
            background-color: #eef6ff;
            color: #1976d2;
        }
        .tree-file-row.downloading {
            background-color: #fff8e1;
            cursor: wait;
        }
        .file-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .tree-file-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #24292f;
        }
        .tree-file-row:hover .tree-file-name {
            color: #1976d2;
            font-weight: 500;
        }
        .file-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #90caf9;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: tree-spin 0.65s linear infinite;
            display: inline-block;
        }
        @keyframes tree-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .file-success-icon {
            color: #2e7d32;
            font-size: 13px;
            font-weight: bold;
            animation: tree-pop 0.3s ease;
        }
        @keyframes tree-pop {
            0% { transform: scale(0.6); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1.0); }
        }
        .file-error-icon {
            color: #d32f2f;
            font-size: 13px;
            font-weight: bold;
        }
        .badge-current-run {
            background: #4caf50;
            color: #fff;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 6px;
        }
        .tree-empty {
            color: #888;
            font-style: italic;
            padding: 16px;
            text-align: center;
        }
        .tree-highlight {
            background-color: #fff59d;
            font-weight: bold;
            border-radius: 2px;
            padding: 0 1px;
        }
    </style>
</head>
<body>
<div class="mui-appbar mui--appbar-color-dark mui--z2">
    <a href="/" style="color:#fff; text-decoration:none; font-size:20px; font-weight:bold;">Mostaql Scraper</a>
    <span style="float:right;">
        <a href="/" style="color:#fff; margin-right:16px;">Home</a>
        <a href="/command-builder" style="color:#fff; margin-right:16px;">Builder</a>
        <a href="/health" style="color:#fff;">Health</a>
    </span>
</div>
<div class="mui-container-fluid">
    {% block content %}{% endblock %}
</div>
</body>
</html>
